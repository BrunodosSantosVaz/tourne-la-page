# Gerado pelo Big Bang v3.1.0 a partir de .bigbang/pipeline/core/files/.github/workflows/bb-publish-maintenance.yml. Não edite: personalize em bigbang.toml.
# Button "Publish maintenance" (v3): a maintenance/* PR into main that changes nothing of the artifact
# (documentation, pipeline) is merged after approval and a green gate; then main returns to develop.
name: Publish maintenance

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the maintenance/* PR into main'
        required: true
        type: string
      dry_run:
        description: 'Only check (changes nothing)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bb-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PROJECT_OWNER != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Merge the maintenance and return main to develop
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR: ${{ inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python .bigbang/bin/bb.py release maintenance --pr "$PR" ${DRY_RUN:+--dry-run}
