# One-time encrypted secret migration; never executes repository code or logs plaintext.
name: Normalize project token
on:
  push:
    branches: [fundacao/0-ligar-github]
permissions:
  contents: read
jobs:
  normalize:
    if: github.repository == 'BrunodosSantosVaz/tourne-la-page' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Seal the existing credential to this repository public key
        shell: python
        env:
          SOURCE_TOKEN: ${{ secrets.TOURNEPAGE_TOKEN }}
          REPOSITORY_PUBLIC_KEY: 3bUUInpZNwHPCcb1OBx6Fxv+mBQuKudgTGnWlI7gTAg=
        run: |
          import base64, ctypes, ctypes.util, json, os
          token = os.environ['SOURCE_TOKEN'].encode()
          if not token:
              raise SystemExit('Missing source credential')
          library = ctypes.CDLL(ctypes.util.find_library('sodium'))
          if library.sodium_init() < 0:
              raise SystemExit('Cannot initialize sealed-box encryption')
          public_key = base64.b64decode(os.environ['REPOSITORY_PUBLIC_KEY'], validate=True)
          sealed = ctypes.create_string_buffer(len(token) + 48)
          library.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          if library.crypto_box_seal(sealed, token, len(token), public_key) != 0:
              raise SystemExit('Cannot encrypt credential')
          print('ENCRYPTED_PROJECT_TOKEN=' + base64.b64encode(sealed.raw).decode())
