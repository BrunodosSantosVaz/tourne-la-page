# Bootstrap validation only; replaced by the generated product CI in F5.
name: Foundation checks
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the Foundation framework and generated files
        run: python .bigbang/bin/bb.py verify
      - name: Scan security without product artifacts
        run: bash .bigbang/esteira/nucleo/scripts/seguranca.sh
        env:
          EVENTO: pull_request
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
