# Gerado pelo Big Bang v3.1.0 a partir de .bigbang/pipeline/core/files/.github/workflows/bb-board-report.yml. Não edite: personalize em bigbang.toml.
# Button "Board report": read only. The state of every open card and the stale claims, in the run summary.
name: Board report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .bigbang/bin/bb.py board show | tee -a "$GITHUB_STEP_SUMMARY"
