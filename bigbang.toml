# Configuração ativa da entrega inicial; decisões e limites documentados na Wiki.
# Flash concentra as verificações e reutiliza a CI do mesmo SHA na candidata.
# O contrato autonomous local foi preservado, sem ampliar delegações de publicação.

[bigbang]
version = "3.1.0"
origin = "BrunodosSantosVaz/big-bang"

[project]
mode = "flash"
name = "Tourne la page"
slug = "tourne-la-page"
owner = "BrunodosSantosVaz"
repository = "BrunodosSantosVaz/tourne-la-page"
visibility = "public"
license = "MIT"

[delivery]
profile = "compiled"
target = ""
artifact_paths = ["app/**", "scripts/package.py", "crates/**", "assets/**", "locales/**", "migrations/**", "packaging/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**"]
version_file = "Cargo.toml"
ecosystems = ["cargo"]

[compiled]
systems = ["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]
build_linux-x64 = "python scripts/package.py linux-x64"
build_linux-arm64 = "python scripts/package.py linux-arm64"
build_windows-x64 = "python scripts/package.py windows-x64"
build_windows-arm64 = "python scripts/package.py windows-arm64"
build_macos-x64 = "python scripts/package.py macos-x64"
build_macos-arm64 = "python scripts/package.py macos-arm64"

[commands]
affected_tests = ""
install = "python scripts/ci.py install"
lint = "python scripts/ci.py lint"
types = "python scripts/ci.py types"
test = "python scripts/ci.py test"
acceptance_test = "python scripts/ci.py acceptance"
architecture = "python scripts/ci.py architecture"
coverage = "python scripts/ci.py coverage"
build = "python scripts/ci.py build"

[tests]
min_coverage = 80
pending_marker = "#[ignore]"
test_pattern = '^\s*(?:pub\s+)?fn\s+[A-Za-z_]\w*\s*\('
structural_paths = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "rust-toolchain.toml", ".cargo/**", "migrations/**", "assets/tokens/**", "scripts/**", "packaging/**"]

[security]
asvs_level = "L2"
browser_database = false
sensitive_paths = ["crates/epub-core/**", "crates/storage/**", "crates/annotations/**", "migrations/**", "packaging/**", "scripts/**"]

[board]
model = "single"
labels = "v3"
owner = "BrunodosSantosVaz"
number = 34

[agents]
names = ["codex-1", "claude-1"]
tasks_per_agent = 1
lease_hours = 24
confirm_seconds = 10

[flags]
max_age_days = 30

[workflow]
model = "grouping"
