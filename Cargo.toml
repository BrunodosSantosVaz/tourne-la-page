[workspace]
members = ["app", "crates/app-core", "crates/epub-core", "crates/storage"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
app-core = { path = "crates/app-core" }
epub-core = { path = "crates/epub-core" }
storage = { path = "crates/storage" }
thiserror = "=2.0.21"

[profile.dev]
incremental = true
opt-level = 1

# Text shaping and rasterization must run at normal speed during local testing.
# Dependencies are compiled once and reused by incremental application builds.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
incremental = true
opt-level = 1
